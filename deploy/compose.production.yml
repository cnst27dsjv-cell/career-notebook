name: career-notebook-production
services:
  web:
    build: ..
    env_file: ../.env.production
    environment:
      LOCAL_DEMO: "false"
    volumes: ["career-files:/app/storage"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  migrate:
    build: ..
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: ../.env.production
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: ..
    command: ["npx", "tsx", "scripts/worker.ts"]
    env_file: ../.env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    env_file: ../.env.production
    volumes: ["career-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    env_file: ../.env.production
    ports: ["80:80", "443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data"]
    depends_on: [web]
    restart: unless-stopped
volumes:
  career-db:
  career-files:
  caddy-data:
